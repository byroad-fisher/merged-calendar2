name: Merge Calendars Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "merge_calendars.py"
      - "sync_notion.py"
      - "requirements.txt"
      - ".github/workflows/merge_calendars.yml"

jobs:
  merge-calendars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEARNING_CALENDAR_URL: ${{ secrets.LEARNING_CALENDAR_URL }}
      SCIENTIA_CALENDAR_URL: ${{ secrets.SCIENTIA_CALENDAR_URL }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
      NOTION_API_VERSION: "2025-09-03"
      SYNC_FROM: "2026-08-01"
      SYNC_UNTIL: "2027-07-31"
      ICS_SOURCE_URL: "https://raw.githubusercontent.com/byroad-fisher/merged-calendar2/main/merged_calendar.ics"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Merge calendar feeds
        run: python merge_calendars.py

      - name: Sync events to Notion
        if: ${{ env.NOTION_TOKEN != '' && env.NOTION_DATA_SOURCE_ID != '' }}
        run: python sync_notion.py

      - name: Explain skipped Notion sync
        if: ${{ env.NOTION_TOKEN == '' || env.NOTION_DATA_SOURCE_ID == '' }}
        run: echo "Notion sync skipped until NOTION_TOKEN and NOTION_DATA_SOURCE_ID are configured."

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add merged_calendar.ics
          if git diff --cached --quiet; then
            echo "No calendar changes to commit"
          else
            git commit -m "Update merged calendar"
            git push
          fi
